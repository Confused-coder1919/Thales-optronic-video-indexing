[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thales"
version = "1.0.0"
description = "Full-stack optronic video indexing platform: frame extraction, entity detection, OCR, transcription, semantic search, and JSON/PDF/CSV reporting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Syed Tashfin"}
]
keywords = ["video-indexing", "entity-detection", "computer-vision", "llm", "video-analysis", "fastapi", "react", "semantic-search", "object-detection", "ocr", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mistralai>=1.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
thales = "thales.cli:main"

[project.urls]
Homepage = "https://github.com/SyedTashfin/Thales-optronic-video-indexing"
Documentation = "https://github.com/SyedTashfin/Thales-optronic-video-indexing#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["thales*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

